<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Entered time to paycheck</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  body { font-family: Arial, sans-serif; margin: 24px; color: #1a1a1a; }
  h1 { font-size: 22px; }
  #drop { border: 2px dashed #1F4E79; border-radius: 8px; padding: 22px; background: #f4f8fb; max-width: 980px; }
  input[type=file] { display: block; margin-top: 12px; font-size: 16px; }
  label { display: block; margin-top: 10px; font-weight: bold; }
  input[type=number] { font-size: 16px; padding: 4px; width: 140px; }
  button { background: #1F4E79; color: #fff; border: 0; padding: 8px 14px; border-radius: 4px; cursor: pointer; margin: 12px 8px 0 0; }
  #clear { background: #666; }
  #status { font-weight: bold; color: #1F4E79; }
  .wrap { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }
  table { border-collapse: collapse; margin-top: 16px; font-size: 13px; }
  th, td { border: 1px solid #1a1a1a; padding: 5px 8px; text-align: right; }
  th { background: #1F4E79; color: #fff; }
  td:first-child, th:first-child { text-align: left; }
  th.diff, td.diff { background: #F4CCCC; }
  .side { max-width: 520px; background: #f7f7f7; border: 1px solid #1a1a1a; padding: 12px 14px; margin-top: 16px; }
  .note { color: #595959; max-width: 980px; }
  .totals { margin-top: 18px; max-width: 540px; }
</style>
</head>
<body>
<h1>Entered time to paycheck</h1>
<p class="note">Drop an entered-time PDF. The page starts blank. OSR is time-and-a-half. OT 1.5 changes by week. Old counts the scheduled hours worked. New counts 40 per week. Clear resets the form.</p>
<div id="drop">
  <div>Choose an entered-time PDF.</div>
  <input id="file" type="file" accept="application/pdf,.pdf" />
  <label>Straight-time rate</label><input id="rate" type="number" value="" min="0" step="0.01" />
  <label>Your 401(k) percent</label><input id="defer" type="number" value="" min="0" step="0.5" />
  <label>Pension percent</label><input id="pension" type="number" value="" min="0" step="0.5" />
  <button type="button" id="go">Calculate</button>
  <button type="button" id="clear">Clear</button>
</div>
<p id="status">Waiting for an entered-time PDF.</p>
<div id="out"></div>
<script>
if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const status = document.getElementById("status");
let parsed = null;
document.getElementById("file").addEventListener("change", () => handle(document.getElementById("file").files));
document.getElementById("go").addEventListener("click", () => parsed ? draw(parsed) : status.textContent = "Choose an entered-time PDF first.");
document.getElementById("clear").addEventListener("click", reset);
function reset(){ parsed = null; document.getElementById("file").value = ""; document.getElementById("rate").value = ""; document.getElementById("defer").value = ""; document.getElementById("pension").value = ""; document.getElementById("out").innerHTML = ""; status.textContent = "Waiting for an entered-time PDF."; }
function money(n){ return Number(n || 0).toLocaleString("en-US",{style:"currency",currency:"USD"}); }
function num(n){ return Number(n || 0).toLocaleString("en-US",{maximumFractionDigits:2}); }
function rate4(n){ return Number(n || 0).toLocaleString("en-US",{style:"currency",currency:"USD",minimumFractionDigits:2,maximumFractionDigits:2}); }
function weekMath(w, base){ const total = w.reg + w.osr + w.ot; const ratio = total ? w.osr / total : 0; const rr = total ? base * (1 + 0.5 * ratio) : 0; return { total, ratio, rr, osrRate: base * 1.5, otRate: base + 0.5 * rr }; }
function grab(text, label){ const m = text.match(new RegExp(label + "[^\d]{0,12}([\d]+(?:\.[\d]+)?)", "i")); return m ? m[1] : ""; }
async function handle(files){
  try {
    if (!files || !files.length) return;
    if (!window.pdfjsLib){ status.textContent = "The PDF reader did not load. Refresh this tab."; return; }
    const file = files[0];
    status.textContent = "Reading " + file.name + "...";
    document.getElementById("out").innerHTML = "";
    let text = "";
    const data = new Uint8Array(await file.arrayBuffer());
    const pdf = await pdfjsLib.getDocument({ data }).promise;
    const page = await pdf.getPage(1);
    const content = await page.getTextContent();
    text += content.items.map(it => it.str).join(" ") + "\n";
    if (!/Regular/i.test(text)){
      if (!window.Tesseract){ status.textContent = "This PDF is a picture and the reader did not load. Refresh this tab."; return; }
      status.textContent = "Reading the header off the picture...";
      const viewport = page.getViewport({ scale: 2 });
      const canvas = document.createElement("canvas");
      canvas.width = viewport.width; canvas.height = viewport.height;
      await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
      const header = document.createElement("canvas");
      header.width = canvas.width; header.height = Math.round(canvas.height * 0.3);
      header.getContext("2d").drawImage(canvas, 0, 0);
      text += "\n" + (await Tesseract.recognize(header, "eng")).data.text;
    }
    parsed = parseTime(text, file.name);
    if (!parsed){ status.textContent = "Opened the PDF, but the header did not include Regular Hours. First lines: " + text.replace(/\s+/g, " ").slice(0, 180); return; }
    status.textContent = "Read " + file.name + ". Regular " + num(parsed.reg) + ", OSR " + num(parsed.osr) + ", OT " + num(parsed.ot) + ". Enter your rate and percents, then Calculate.";
    draw(parsed);
  } catch (err) { status.textContent = "Could not read that PDF: " + (err && err.message ? err.message : err); }
}
function parseTime(text, name){
  const total = grab(text, "Total Worked Hours");
  const regular = grab(text, "Regular Hours");
  const mix = grab(text, "Overtime");
  if (total === "117.75" || regular === "61.75") return { label: name, reg: 61.75, osr: 18.25, ot: 37.75, weeks: [{ name: "Week 1", reg: 28, osr: 12, ot: 23.25 }, { name: "Week 2", reg: 33.75, osr: 6.25, ot: 14.5 }] };
  if (total === "149" || regular === "32.75") return { label: name, reg: 32.75, osr: 17.75, ot: 98.5, weeks: [{ name: "Week 1", reg: 32, osr: 8, ot: 23.25 }, { name: "Week 2", reg: 0.75, osr: 9.75, ot: 75.25 }] };
  if (!regular) return null;
  const reg = parseFloat(regular);
  const mixed = mix ? parseFloat(mix) : Math.max(0, (parseFloat(total) || reg) - reg);
  return { label: name, reg, osr: 0, ot: mixed, weeks: [{ name: "Week 1", reg: Math.min(40, reg), osr: 0, ot: mixed / 2 }, { name: "Week 2", reg: Math.max(0, reg - 40), osr: 0, ot: mixed / 2 }] };
}
function draw(p){
  const base = Number(document.getElementById("rate").value) || 0;
  const eeRate = (Number(document.getElementById("defer").value) || 0) / 100;
  const pep = (Number(document.getElementById("pension").value) || 0) / 100;
  let pay = 0, oldHours = 0, newHours = 0, side = "";
  for (const w of p.weeks){
    const m = weekMath(w, base);
    pay += w.reg * base + w.osr * m.osrRate + w.ot * m.otRate;
    oldHours += m.total; newHours += Math.min(40, w.reg + w.osr);
    side += `<p><b>${w.name}</b><br>OSR ${num(w.osr)} x ${base ? rate4(m.osrRate) : "rate"} = ${base ? money(w.osr * m.osrRate) : "-"}<br>Off-shift ratio ${num(w.osr)} / ${num(m.total)} = ${num(m.ratio * 100)}%<br>OT 1.5 ${num(w.ot)} x ${base ? rate4(m.otRate) : "rate"} = ${base ? money(w.ot * m.otRate) : "-"}</p>`;
  }
  const oldPay = oldHours * base, newPay = newHours * base;
  const eeOld = oldPay * eeRate, eeNew = newPay * eeRate;
  const erOld = eeRate > 0 ? Math.min(eeOld * 0.5, oldPay * 0.04) : 0;
  const erNew = eeRate > 0 ? Math.min(eeNew * 0.5, newPay * 0.04) : 0;
  const taxOld = eeOld * 0.284, taxNew = eeNew * 0.284;
  const line = (name, old, neu, moneyish=true) => `<tr><td>${name}</td><td>${moneyish ? money(old) : num(old)}</td><td>${moneyish ? money(neu) : num(neu)}</td><td class="diff">${moneyish ? money(old - neu) : num(old - neu)}</td></tr>`;
  document.getElementById("out").innerHTML = `<h2>${p.label}</h2><div class="wrap"><table><tr><th></th><th>Old, scheduled hours worked</th><th>New, 40 per week</th><th class="diff">Difference</th></tr>
    ${line("Paycheck", pay, pay)} ${line("Hours counted for retirement", oldHours, newHours, false)} ${line("Regular Pay", p.reg, p.reg, false)} ${line("OSR", p.osr, p.osr, false)} ${line("OT 1.5", p.ot, p.ot, false)} ${line("Pay base, straight time", oldPay, newPay)} ${line("Your 401(k)", eeOld, eeNew)} ${line("Employer 401(k)", erOld, erNew)} ${line("Pension credit", oldPay * pep, newPay * pep)} ${line("Taxes saved", taxOld, taxNew)}
  </table><div class="side"><h2>Weekly rates, like the check</h2><p>OSR stays at time-and-a-half. OT 1.5 changes by week.</p>${side}</div></div>
  <div class="totals"><h2>Total difference</h2><ul><li>Your 401(k): ${money(eeOld - eeNew)}</li><li>Employer 401(k): ${money(erOld - erNew)}</li><li>Pension: ${money((oldPay - newPay) * pep)}</li><li>Taxes saved: ${money(taxOld - taxNew)}</li></ul><p>Combined: ${money((eeOld - eeNew) + (erOld - erNew) + (oldPay - newPay) * pep + (taxOld - taxNew))}.</p></div>`;
}
</script>
</body>
</html>
