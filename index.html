<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Old pay vs new pay</title>
<style>
  body { font-family: Arial, sans-serif; margin: 24px; color: #1a1a1a; }
  h1 { font-size: 22px; }
  label { display: block; margin-top: 10px; font-weight: bold; }
  input { font-size: 16px; padding: 4px; width: 140px; }
  button { background: #1F4E79; color: #fff; border: 0; padding: 8px 14px; border-radius: 4px; cursor: pointer; margin-top: 12px; }
  .wrap { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }
  table { border-collapse: collapse; margin-top: 16px; font-size: 13px; }
  th, td { border: 1px solid #1a1a1a; padding: 5px 8px; text-align: right; }
  th { background: #1F4E79; color: #fff; }
  td:first-child, th:first-child { text-align: left; }
  th.diff, td.diff { background: #F4CCCC; }
  .side { max-width: 460px; background: #f7f7f7; border: 1px solid #1a1a1a; padding: 12px 14px; margin-top: 16px; }
  .note { color: #595959; max-width: 920px; }
  .totals { margin-top: 18px; max-width: 520px; }
</style>
</head>
<body>
<h1>09/28/2026-10/11/2026 entered time</h1>
<p class="note">Hours are from the entered-time PDF. Old method counts every worked hour toward retirement. New method counts 40 hours each week, regular and off-shift. Enter your rate, 401(k) percent, and pension percent.</p>
<label>Straight-time rate</label><input id="rate" type="number" value="" min="0" step="0.01" />
<label>Your 401(k) percent</label><input id="defer" type="number" value="" min="0" step="0.5" />
<label>Pension percent</label><input id="pension" type="number" value="" min="0" step="0.5" />
<button type="button" id="go">Calculate</button>
<div id="out"></div>
<script>
const CO = 0.044;
const weeks = [
  { name: "Week of 09/28", reg: 32, off: 8, ot: 23.25 },
  { name: "Week of 10/05", reg: 0.25, off: 9.75, ot: 70.5 }
];
document.getElementById("go").onclick = draw;
function money(n){ return Number(n || 0).toLocaleString("en-US",{style:"currency",currency:"USD"}); }
function num(n){ return Number(n).toLocaleString("en-US",{maximumFractionDigits:2}); }
function rate4(n){ return Number(n || 0).toLocaleString("en-US",{style:"currency",currency:"USD",minimumFractionDigits:4,maximumFractionDigits:4}); }
function draw(){
  const base = Number(document.getElementById("rate").value) || 0;
  const eeRate = (Number(document.getElementById("defer").value) || 0) / 100;
  const pep = (Number(document.getElementById("pension").value) || 0) / 100;
  let oldHours = 0, newHours = 0, pay = 0, side = "";
  for (const w of weeks){
    const total = w.reg + w.off + w.ot;
    const ratio = total ? w.off / total : 0;
    const rr = base * (1 + 0.5 * ratio);
    const otRate = base + 0.5 * rr;
    oldHours += total;
    newHours += 40;
    pay += w.reg * base + w.off * base * 1.5 + w.ot * otRate;
    side += `<p><b>${w.name}</b><br>Regular ${num(w.reg)}, off-shift ${num(w.off)}, OT ${num(w.ot)}.<br>Old counts ${num(total)}. New counts 40.<br>Off-shift ratio ${num(ratio * 100)}%. OT rate ${base ? rate4(otRate) : "enter a rate"}.</p>`;
  }
  const oldPay = oldHours * base, newPay = newHours * base;
  const eeOld = oldPay * eeRate, eeNew = newPay * eeRate;
  const erOld = eeRate > 0 ? Math.min(eeOld * 0.5, oldPay * 0.04) : 0;
  const erNew = eeRate > 0 ? Math.min(eeNew * 0.5, newPay * 0.04) : 0;
  const taxOld = eeOld * (0.24 + CO), taxNew = eeNew * (0.24 + CO);
  const line = (name, old, neu, moneyish=true) => `<tr><td>${name}</td><td>${moneyish ? money(old) : num(old)}</td><td>${moneyish ? money(neu) : num(neu)}</td><td class="diff">${moneyish ? money(old - neu) : num(old - neu)}</td></tr>`;
  document.getElementById("out").innerHTML = `<div class="wrap"><table><tr><th></th><th>Old, all worked hours</th><th>New, 40 each week</th><th class="diff">Difference</th></tr>
    ${line("Paycheck", pay, pay)}
    ${line("Hours counted for retirement", oldHours, newHours, false)}
    ${line("Pay base, straight time", oldPay, newPay)}
    ${line("Your 401(k)", eeOld, eeNew)}
    ${line("Employer 401(k)", erOld, erNew)}
    ${line("Pension credit", oldPay * pep, newPay * pep)}
    ${line("Taxes saved", taxOld, taxNew)}
  </table><div class="side"><h2>Hours from the PDF</h2>${side}<p>The 15-minute turnover on 10/05 is the 0.25 regular hour. The rest of that outside work is off-shift or weekly overtime.</p></div></div>
  <div class="totals"><h2>Total difference</h2><ul><li>Your 401(k): ${money(eeOld - eeNew)}</li><li>Employer 401(k): ${money(erOld - erNew)}</li><li>Pension: ${money((oldPay - newPay) * pep)}</li><li>Taxes saved: ${money(taxOld - taxNew)}</li></ul><p>Combined: ${money((eeOld - eeNew) + (erOld - erNew) + (oldPay - newPay) * pep + (taxOld - taxNew))}.</p></div>`;
}
draw();
</script>
</body>
</html>
