<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Old vs new pension hours</title>
<style>
  body { font-family: Arial, sans-serif; margin: 24px; color: #1a1a1a; }
  h1 { font-size: 22px; }
  label { display: block; margin: 10px 0 4px; font-weight: bold; }
  input { font-size: 16px; padding: 6px; width: 140px; }
  button { background: #1F4E79; color: #fff; border: 0; padding: 8px 14px; border-radius: 4px; cursor: pointer; margin-top: 12px; }
  table { border-collapse: collapse; margin-top: 16px; }
  th, td { border: 1px solid #d9d9d9; padding: 6px 10px; text-align: right; }
  th { background: #1F4E79; color: #fff; }
  .old { background: #e2efda; }
  .new { background: #fce4d6; }
  .note { color: #595959; max-width: 720px; }
</style>
</head>
<body>
<h1>Old hours vs 40-hour cap</h1>
<p class="note">Type the hours worked each week. The old method counts every hour. The new method counts 40 per week and drops the rest. A week of 86 and a week of 0 counts as 40, not 86.</p>
<label>Week 1 hours worked</label><input id="w1" type="number" value="86" min="0" step="0.25" />
<label>Week 2 hours worked</label><input id="w2" type="number" value="0" min="0" step="0.25" />
<label>Straight-time rate</label><input id="rate" type="number" value="72.40" min="0" step="0.01" />
<button type="button" id="go">Calculate old vs new</button>
<div id="out"></div>
<script>
const CAP = 40, MATCH = 0.04, PEP = 0.10, YEAR = 2016;
function money(n) { return n.toLocaleString("en-US", { style: "currency", currency: "USD" }); }
function num(n) { return Number(n).toLocaleString("en-US", { maximumFractionDigits: 2 }); }
function calc() {
  const w1 = Number(document.getElementById("w1").value) || 0;
  const w2 = Number(document.getElementById("w2").value) || 0;
  const rate = Number(document.getElementById("rate").value) || 0;
  const oldHours = w1 + w2;
  const newHours = Math.min(w1, CAP) + Math.min(w2, CAP);
  const dropped = Math.max(0, oldHours - newHours);
  const lost401 = dropped * rate * MATCH;
  const pepLost = dropped * rate * PEP;
  document.getElementById("out").innerHTML =
    `<table>
      <tr><th></th><th>Week 1</th><th>Week 2</th><th>Counted</th></tr>
      <tr class="old"><td>Old method</td><td>${num(w1)}</td><td>${num(w2)}</td><td>${num(oldHours)}</td></tr>
      <tr class="new"><td>New method, 40 max</td><td>${num(Math.min(w1, CAP))}</td><td>${num(Math.min(w2, CAP))}</td><td>${num(newHours)}</td></tr>
    </table>
    <p><b>Pension hours:</b> old method counts ${num(oldHours)}. New method counts ${num(newHours)}. Hours not counted: ${num(dropped)}.</p>
    <p>401(k) match not paid on those hours, at 4%: ${money(lost401)}. PEP balance credit not earned, at 10% of straight time: ${money(pepLost)}.</p>
    <p class="note">The empty week does not give the overtime week back. 86 and 0 is 40, not 80.</p>`;
}
document.getElementById("go").onclick = calc;
calc();
</script>
</body>
</html>
